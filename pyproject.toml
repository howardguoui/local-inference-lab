[project]
name = "local-inference-lab"
version = "0.1.0"
description = "Serve, size and benchmark local LLMs on one consumer GPU: vLLM vs llama.cpp vs Ollama, KV cache and offload planning, and an MCP server for agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "pyyaml>=6.0",
  "fastmcp>=2.10",
  "nvidia-ml-py>=12.0",
  "gguf>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "fastapi>=0.115", "ruff==0.16.10"]

[project.scripts]
inference-lab = "inference_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
